{% extends "base.html" %}

{% block title %}Terminal - VPS Control Panel{% endblock %}
{% block page_title %}💻 Linux Shell Terminal{% endblock %}

{% block head %}
<!-- xterm CSS from local and CDN fallback -->
<link rel="stylesheet" href="/static/vendor/xterm/xterm.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<!-- xterm JS from local with CDN fallback -->
<script src="/static/vendor/xterm/xterm.min.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.min.js"></script>
<script>
if (typeof Terminal === "undefined") {
    document.write('<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"><\/script>');
    document.write('<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"><\/script>');
}
</script>
{% endblock %}

{% block content %}
<!-- Fallback load in content if head was bypassed -->
<link rel="stylesheet" href="/static/vendor/xterm/xterm.min.css">
<script src="/static/vendor/xterm/xterm.min.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.min.js"></script>

<style>
.terminal-window {
    background: #080c14;
    border: 1px solid #1e293b;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 135px);
    min-height: 520px;
    position: relative;
    box-sizing: border-box;
}

.terminal-window.is-fullscreen {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 999999 !important;
    border-radius: 0 !important;
    margin: 0 !important;
}

.term-header {
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    flex-shrink: 0;
}

.term-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.term-dots {
    display: flex;
    align-items: center;
    gap: 8px;
}

.term-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
}

.term-dot.red { background: #ef4444; }
.term-dot.yellow { background: #f59e0b; }
.term-dot.green { background: #10b981; }

.term-title {
    font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 6px;
}

.term-body {
    flex: 1;
    background: #080c14;
    padding: 6px 10px;
    overflow: hidden;
    position: relative;
    cursor: text;
}

#terminalContainer {
    width: 100%;
    height: 100%;
}

#terminalContainer .xterm {
    padding: 4px;
    height: 100%;
}

#terminalContainer .xterm-viewport {
    background-color: #080c14 !important;
}

#terminalContainer .xterm-viewport::-webkit-scrollbar {
    width: 8px;
}
#terminalContainer .xterm-viewport::-webkit-scrollbar-track {
    background: #080c14;
}
#terminalContainer .xterm-viewport::-webkit-scrollbar-thumb {
    background: #1e293b;
    border-radius: 4px;
}
#terminalContainer .xterm-viewport::-webkit-scrollbar-thumb:hover {
    background: #334155;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.status-badge.disconnected {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.3);
}

.status-badge.connecting {
    background: rgba(245, 158, 11, 0.15);
    color: #fde68a;
    border-color: rgba(245, 158, 11, 0.3);
}

.term-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #cbd5e1;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
}

.term-btn:hover {
    background: #334155;
    color: #ffffff;
    border-color: #475569;
}
</style>

<div class="terminal-window" id="terminalWindow">
    
    <!-- Clean Authentic Terminal Titlebar -->
    <div class="term-header">
        <div class="term-left">
            <div class="term-dots">
                <span class="term-dot red" title="Reset Session" onclick="reconnectTerminal()"></span>
                <span class="term-dot yellow" title="Clear Screen" onclick="clearTerminal()"></span>
                <span class="term-dot green" title="Toggle Fullscreen" onclick="toggleFullscreen()"></span>
            </div>
            <div class="term-title">
                <span>💻 root@{{ server_ip }}</span>
                <span style="color: #64748b; font-weight: normal; font-size: 11px;">(bash)</span>
            </div>
            <div id="termStatusBadge" class="status-badge connecting">
                <span>●</span> Connecting...
            </div>
        </div>

        <!-- Clean Action Buttons (No dropdowns) -->
        <div style="display: flex; gap: 8px; align-items: center;">
            <button onclick="clearTerminal()" class="term-btn" title="Clear screen">
                🧹 Clear
            </button>
            <button onclick="reconnectTerminal()" class="term-btn" title="Restart bash session">
                🔄 Reconnect
            </button>
            <button onclick="toggleFullscreen()" class="term-btn" id="btnFullscreen" title="Toggle Fullscreen">
                ⛶ Fullscreen
            </button>
        </div>
    </div>

    <!-- Live xterm.js Terminal Canvas -->
    <div class="term-body" id="termBody" onclick="focusTerminal()">
        <div id="terminalContainer"></div>
    </div>
</div>

<script>
let term = null;
let fitAddon = null;
let socket = null;
const token = "{{ token }}";
const serverIp = "{{ server_ip }}";
const terminalContainer = document.getElementById("terminalContainer");
const statusBadge = document.getElementById("termStatusBadge");
const terminalWindow = document.getElementById("terminalWindow");

function initTerminal() {
    if (typeof Terminal === "undefined" || typeof FitAddon === "undefined") {
        setTimeout(initTerminal, 80);
        return;
    }

    // Prevent double init
    if (term) return;

    term = new Terminal({
        cursorBlink: true,
        cursorStyle: "block",
        fontSize: 14,
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace",
        lineHeight: 1.25,
        theme: {
            background: "#080c14",
            foreground: "#f8fafc",
            cursor: "#38bdf8",
            cursorAccent: "#080c14",
            selectionBackground: "rgba(56, 189, 248, 0.35)",
            black: "#1e293b",
            red: "#ef4444",
            green: "#10b981",
            yellow: "#f59e0b",
            blue: "#3b82f6",
            magenta: "#ec4899",
            cyan: "#06b6d4",
            white: "#f8fafc",
            brightBlack: "#475569",
            brightRed: "#f87171",
            brightGreen: "#34d399",
            brightYellow: "#fbbf24",
            brightBlue: "#60a5fa",
            brightMagenta: "#f472b6",
            brightCyan: "#22d3ee",
            brightWhite: "#ffffff"
        },
        allowTransparency: true,
        scrollback: 10000,
        convertEol: true
    });

    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(terminalContainer);
    
    // Fit to container dimensions
    try {
        fitAddon.fit();
    } catch (e) {}

    // Send every keystroke (Tab, Enter, arrows, Ctrl+C, typing) directly to backend PTY
    term.onData(data => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(data);
        }
    });

    connectWebSocket();

    // Resize listeners
    window.addEventListener("resize", debounceFit);

    if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => debounceFit());
        ro.observe(document.getElementById("termBody"));
    }
}

function connectWebSocket() {
    updateStatus("connecting", "Connecting...");
    
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const host = location.host;
    const wsUrl = `${protocol}//${host}/terminal/ws?token=${encodeURIComponent(token)}`;

    if (socket) {
        try { socket.close(); } catch (e) {}
    }

    socket = new WebSocket(wsUrl);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
        updateStatus("connected", "🟢 Connected");
        focusTerminal();
        
        setTimeout(() => {
            if (fitAddon) fitAddon.fit();
            sendResize(term.cols, term.rows);
        }, 150);
    };

    socket.onmessage = event => {
        if (event.data instanceof ArrayBuffer) {
            term.write(new Uint8Array(event.data));
        } else {
            term.write(event.data);
        }
    };

    socket.onclose = () => {
        updateStatus("disconnected", "🔴 Disconnected");
        if (term) {
            term.write("\r\n\x1b[31m[Session closed. Click Reconnect to restart.]\x1b[0m\r\n");
        }
    };

    socket.onerror = () => {
        updateStatus("disconnected", "🔴 Connection Error");
    };
}

function updateStatus(state, text) {
    statusBadge.className = "status-badge " + state;
    statusBadge.innerHTML = `<span>●</span> ${text}`;
}

function sendResize(cols, rows) {
    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
            type: "resize",
            cols: cols,
            rows: rows
        }));
    }
}

let fitTimer = null;
function debounceFit() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => {
        if (fitAddon && term) {
            try {
                fitAddon.fit();
                sendResize(term.cols, term.rows);
            } catch (e) {}
        }
    }, 100);
}

function focusTerminal() {
    if (term) term.focus();
}

function clearTerminal() {
    if (term) {
        term.clear();
        focusTerminal();
    }
}

function reconnectTerminal() {
    if (term) term.clear();
    connectWebSocket();
}

function toggleFullscreen() {
    terminalWindow.classList.toggle("is-fullscreen");
    const btn = document.getElementById("btnFullscreen");
    if (terminalWindow.classList.contains("is-fullscreen")) {
        btn.innerText = "✕ Exit Fullscreen";
    } else {
        btn.innerText = "⛶ Fullscreen";
    }
    setTimeout(debounceFit, 150);
    focusTerminal();
}

document.addEventListener("keydown", e => {
    if (e.key === "Escape" && terminalWindow.classList.contains("is-fullscreen")) {
        toggleFullscreen();
    }
});

// Start initialization
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initTerminal);
} else {
    initTerminal();
}
</script>
{% endblock %}
